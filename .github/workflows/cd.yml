name: CD

# main  -> web bundle + debug APK + server distribution as artifacts;
#          web deployed to GitHub Pages when repo variable DEPLOY_WEB_PAGES == 'true'
#          (Pages on a private repo needs a paid plan; enable Pages with source "GitHub Actions").
# v* tag -> GitHub Release with the APK attached.
# Server hosting is not chosen yet: add a deploy job here once it is.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: composeApp/build/dist/wasmJs/productionExecutable
      - if: vars.DEPLOY_WEB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  pages:
    name: Deploy web to GitHub Pages
    needs: web
    if: vars.DEPLOY_WEB_PAGES == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Debug-signed until we add a release keystore as a secret.
      - run: ./gradlew :composeApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: composeApp/build/outputs/apk/debug/*.apk

  server:
    name: Server distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :server:distZip
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: server/build/distributions/*.zip
